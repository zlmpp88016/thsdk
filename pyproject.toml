[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thsdk"
version = "2.0.2"
description = "THSDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thsdk = ["py.typed", "libs/**/*", "examples/**/*"]
